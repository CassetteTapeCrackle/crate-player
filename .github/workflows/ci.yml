name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test and build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Swift version
        run: swift --version

      - name: Run tests
        run: ./test.sh

      - name: Build the app bundle
        run: ./build.sh

      - name: Check the bundle
        run: |
          test -x build/Crate.app/Contents/MacOS/Crate
          test -f build/Crate.app/Contents/Resources/Crate.icns
          test -f build/Crate.app/Contents/Resources/Fonts/DepartureMono-Regular.otf
          codesign --verify --strict build/Crate.app
